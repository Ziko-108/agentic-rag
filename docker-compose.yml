services:
  db:
    # Postgres with the pgvector extension: documents, chunks, conversations and vectors in one place
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"  # local only, for development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # FastAPI backend: ingestion, retrieval, agent. Ingests ./starter/data/pdfs on first start.
    build: ./backend
    env_file: .env  # the OpenAI key arrives here at run time; it is not in the image
    environment:
      POSTGRES_HOST: db
      SEED_DIR: /data/pdfs
      OMP_NUM_THREADS: 4  # the CPU reranker may use 4 threads, not every core
      # fallback LLM: Ollama on the host, used only if FALLBACK_MODEL is set in .env
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux needs this; Docker Desktop has it built in
    volumes:
      - ./starter/data/pdfs:/data/pdfs:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ui:
    # Next.js chat UI; it forwards /api/* to the backend
    build: ./ui
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:3000"
    depends_on:
      - api  # not "healthy": the UI starts at once and shows "API down" until the API is up
    restart: unless-stopped

volumes:
  pgdata:
